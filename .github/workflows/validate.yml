name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The detector runs before the thing that depends on it: a silently broken
      # placeholder check looks exactly like a clean repo.
      - run: ./tests/placeholders-test.sh
      - run: ./scripts/validate.sh
