services:
  db:
    image: postgres:${ZITADEL_DB_VERSION:-17-alpine}
    environment:
      POSTGRES_DB: ${DB_NAME:-zitadel}
      POSTGRES_USER: ${DB_USER:-zitadel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
    volumes:
      - zitadel-db:/var/lib/postgresql/data
    networks:
      - zitadel_internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: stop-first
      restart_policy:
        condition: any
      resources:
        limits:
          memory: ${MEM_LIMIT_DB:-512M}

  zitadel:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:?ZITADEL_VERSION not set}
    # start-from-init runs setup then serves, so a fresh volume needs no second step.
    command: ["start-from-init", "--masterkeyFromEnv", "--tlsMode", "external"]
    environment:
      # EXACTLY 32 characters. Zitadel refuses to start otherwise, and it cannot
      # be changed later without re-encrypting every stored secret.
      ZITADEL_MASTERKEY: ${MASTERKEY:?MASTERKEY not set}
      ZITADEL_EXTERNALDOMAIN: ${DOMAIN:?DOMAIN not set}
      ZITADEL_EXTERNALPORT: "443"
      ZITADEL_EXTERNALSECURE: "true"          # Traefik terminates TLS
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${DB_NAME:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${DB_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${DB_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # MAIL IS NOT OPTIONAL HERE. Zitadel's whole account model is an
      # initialisation email with a code: create a human user and they get a
      # link. With no SMTP the user is created and the invitation never arrives.
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: ${SMTP_HOST:?SMTP_HOST not set}:${SMTP_PORT:-587}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_USER: ${SMTP_USER:?SMTP_USER not set}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD not set}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: ${SMTP_USE_TLS:-true}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: ${MAIL_FROM:?MAIL_FROM not set}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: ${MAIL_FROM_NAME:-Chattanooga.Digital}
      # The sender domain is the mail provider's, not this host's. Left true,
      # Zitadel refuses to send because the From address does not match
      # ExternalDomain -- and it refuses quietly.
      ZITADEL_DEFAULTINSTANCE_DOMAINPOLICY_SMTPSENDERADDRESSMATCHESINSTANCEDOMAIN: "false"
      # Seeds the first admin on an EMPTY database only.
      # The org NAME decides the login name, so pin it rather than inheriting
      # Zitadel's default: the admin signs in as <user>@<org>.<domain>, and a
      # bare "admin" resolves to something else entirely and is rejected with
      # Errors.User.NotHuman, which reads like the account was never created.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ORG_NAME:-zitadel}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ADMIN_USER:-admin}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD not set}
      # DELIBERATE TRADE, AND IT IS A REAL ONE. Zitadel otherwise demands a
      # password change at the admin's first login. Going through with it
      # produces a password recorded nowhere, while ADMIN_PASSWORD above keeps
      # describing one that no longer works - so the stack file stops being the
      # truth about the system and the real credential exists only in someone's
      # head. Seeding it already-changed keeps those two in agreement.
      # What it costs: one layer is gone. The control that remains is that the
      # value is machine-generated and long, not that it gets replaced.
      # Scope: this is the bootstrap admin on an EVALUATION stack with no real
      # data. IF ZITADEL IS THE ONE WE PICK, this goes back to "true" and the
      # changed password gets recorded properly before anything real lands here.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      TZ: ${TZ:-America/New_York}
    networks:
      - traefik_net
      - zitadel_internal
    depends_on:
      - db
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK:-traefik_net}"
        - "traefik.http.routers.${INSTANCE_NAME:?INSTANCE_NAME not set}.rule=Host(`${DOMAIN:?DOMAIN not set}`)"
        - "traefik.http.routers.${INSTANCE_NAME}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.${INSTANCE_NAME}.tls=true"
        - "traefik.http.routers.${INSTANCE_NAME}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}"
        - "traefik.http.services.${INSTANCE_NAME}.loadbalancer.server.port=8080"
        # Zitadel's API is gRPC-Web; Traefik must speak h2c to it.
        - "traefik.http.services.${INSTANCE_NAME}.loadbalancer.server.scheme=h2c"
      restart_policy:
        condition: any
      resources:
        limits:
          memory: ${MEM_LIMIT_ZITADEL:-1G}

networks:
  traefik_net:
    external: true
  # Owned by this stack rather than expected from the cluster. The shared
  # network exists on production but NOT on staging, so declaring it external
  # means the stack cannot start there - and staging is where this gets
  # evaluated. Every other stack on both clusters owns its own the same way.
  zitadel_internal: {}

volumes:
  zitadel-db:
