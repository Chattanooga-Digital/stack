x-deploy-defaults: &deploy-defaults
  replicas: 1
  update_config:
    order: stop-first
    parallelism: 1
    delay: 5s
    failure_action: rollback
    monitor: 60s
  restart_policy:
    condition: any
    delay: 10s
    max_attempts: 0
  placement:
    constraints:
      - ${PLACEMENT_CONSTRAINT:-node.role == manager}

x-deploy-stateless: &deploy-stateless
  replicas: 1
  update_config:
    order: start-first
    parallelism: 1
    delay: 5s
    failure_action: rollback
    monitor: 60s
  restart_policy:
    condition: any
    delay: 10s
    max_attempts: 0
  placement:
    constraints:
      - ${PLACEMENT_CONSTRAINT:-node.role == manager}

networks:
  traefik_net:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_net}
  nextcloud_internal:
    driver: overlay
    attachable: false

volumes:
  nextcloud_html:
    driver: local
  nextcloud_db:
    driver: local

services:
  db:
    image: postgres:${POSTGRES_VERSION:-18}
    environment:
      POSTGRES_DB: ${NC_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NC_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD:?NC_DB_PASSWORD not set}
    volumes:
      # postgres:18 takes the volume one level up from 17 and earlier. Mounting
      # /var/lib/postgresql/data against 18 fails at startup with pg_upgrade advice
      # and no obvious error line. docker-library/postgres#37
      - nextcloud_db:/var/lib/postgresql
    networks:
      - nextcloud_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NC_DB_USER:-nextcloud} -d ${NC_DB_NAME:-nextcloud}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${MEM_LIMIT_DB:-1G}

  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    command: ["redis-server", "--requirepass", "${NC_REDIS_PASSWORD:?NC_REDIS_PASSWORD not set}", "--save", "", "--appendonly", "no"]
    environment:
      NC_REDIS_PASSWORD: ${NC_REDIS_PASSWORD:?NC_REDIS_PASSWORD not set}
    networks:
      - nextcloud_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${NC_REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${MEM_LIMIT_REDIS:-256M}

  app:
    image: nextcloud:${NEXTCLOUD_VERSION:?NEXTCLOUD_VERSION not set}
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${NC_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NC_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD:?NC_DB_PASSWORD not set}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${NC_REDIS_PASSWORD:?NC_REDIS_PASSWORD not set}
      # Never "admin": the built-in account is disabled once this one exists.
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:?NC_ADMIN_USER not set}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:?NC_ADMIN_PASSWORD not set}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NC_DOMAIN:?NC_DOMAIN not set}
      OVERWRITEHOST: ${NC_DOMAIN:?NC_DOMAIN not set}
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://${NC_DOMAIN:?NC_DOMAIN not set}
      # nextcloud/docker splits this value on spaces. Set this to the proxy
      # overlay subnet, not every RFC1918 range, on a shared host.
      TRUSTED_PROXIES: ${NC_TRUSTED_PROXIES:?NC_TRUSTED_PROXIES not set}
      PHP_UPLOAD_LIMIT: ${NC_PHP_UPLOAD_LIMIT:-10G}
      PHP_MEMORY_LIMIT: ${NC_PHP_MEMORY_LIMIT:-1024M}
      # OBJECTSTORE_S3_* is honoured at first install only. Adopting object storage
      # after a rebuild is a data migration, not a config change.
    volumes:
      - nextcloud_html:/var/www/html
    networks:
      - traefik_net
      - nextcloud_internal
    depends_on:
      - db
      - redis
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${MEM_LIMIT_APP:-2G}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK:-traefik_net}"
        - "traefik.http.routers.${INSTANCE_NAME:?INSTANCE_NAME not set}-app.rule=Host(`${NC_DOMAIN}`)"
        - "traefik.http.routers.${INSTANCE_NAME}-app.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.${INSTANCE_NAME}-app.tls=true"
        - "traefik.http.routers.${INSTANCE_NAME}-app.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}"
        - "traefik.http.routers.${INSTANCE_NAME}-app.priority=10"
        - "traefik.http.services.${INSTANCE_NAME}-app.loadbalancer.server.port=80"
        # CalDAV/CardDAV clients probe /.well-known before anything else.
        - "traefik.http.middlewares.${INSTANCE_NAME}-dav.redirectregex.regex=https://(.*)/.well-known/(card|cal)dav"
        - "traefik.http.middlewares.${INSTANCE_NAME}-dav.redirectregex.replacement=https://$${1}/remote.php/dav/"
        - "traefik.http.middlewares.${INSTANCE_NAME}-dav.redirectregex.permanent=true"
        - "traefik.http.middlewares.${INSTANCE_NAME}-upload.buffering.maxRequestBodyBytes=${UPLOAD_MAX_BYTES:-10737418240}"
        - "traefik.http.middlewares.${INSTANCE_NAME}-security.headers.stsSeconds=15552000"
        - "traefik.http.middlewares.${INSTANCE_NAME}-security.headers.stsIncludeSubdomains=true"
        - "traefik.http.routers.${INSTANCE_NAME}-app.middlewares=${INSTANCE_NAME}-security@swarm,${INSTANCE_NAME}-dav@swarm,${INSTANCE_NAME}-upload@swarm"

  # Must share app's image and webroot volume. Without it no background job runs
  # and the admin overview shows a permanent cron warning.
  cron:
    image: nextcloud:${NEXTCLOUD_VERSION:?NEXTCLOUD_VERSION not set}
    entrypoint: ["/cron.sh"]
    volumes:
      - nextcloud_html:/var/www/html
    networks:
      - nextcloud_internal
    depends_on:
      - app
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${MEM_LIMIT_CRON:-512M}

  collabora:
    image: collabora/code:${COLLABORA_VERSION:?COLLABORA_VERSION not set}
    environment:
      aliasgroup1: https://${NC_DOMAIN:?NC_DOMAIN not set}:443
      server_name: ${NC_DOMAIN:?NC_DOMAIN not set}
      dictionaries: ${COLLABORA_DICTIONARIES:-en_US}
      extra_params: --o:ssl.enable=false --o:ssl.termination=true --o:logging.disable_server_audit=true --o:welcome.enable=false
    networks:
      - traefik_net
      - nextcloud_internal
    deploy:
      <<: *deploy-stateless
      resources:
        limits:
          memory: ${MEM_LIMIT_COLLABORA:-2G}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK:-traefik_net}"
        - "traefik.http.routers.${INSTANCE_NAME:?INSTANCE_NAME not set}-office.rule=Host(`${NC_DOMAIN}`) && (PathPrefix(`/browser`) || PathPrefix(`/hosting`) || PathPrefix(`/cool`))"
        - "traefik.http.routers.${INSTANCE_NAME}-office.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.${INSTANCE_NAME}-office.tls=true"
        - "traefik.http.routers.${INSTANCE_NAME}-office.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}"
        - "traefik.http.routers.${INSTANCE_NAME}-office.priority=100"
        - "traefik.http.routers.${INSTANCE_NAME}-office.middlewares=${INSTANCE_NAME}-security@swarm"
        - "traefik.http.services.${INSTANCE_NAME}-office.loadbalancer.server.port=9980"

  whiteboard:
    image: ghcr.io/nextcloud-releases/whiteboard:${WHITEBOARD_VERSION:?WHITEBOARD_VERSION not set}
    environment:
      NEXTCLOUD_URL: https://${NC_DOMAIN:?NC_DOMAIN not set}
      # Must equal the whiteboard app's jwt_secret_key. A mismatch does not fail the
      # deploy; boards silently never connect.
      JWT_SECRET_KEY: ${NC_JWT_SECRET:?NC_JWT_SECRET not set}
      # Do NOT set STORAGE_STRATEGY=redis. The release build's Redis path exits with
      # "TypeError: RedisStrategy.createRedisClient is not a function".
    networks:
      - traefik_net
      - nextcloud_internal
    deploy:
      <<: *deploy-stateless
      resources:
        limits:
          memory: ${MEM_LIMIT_WHITEBOARD:-512M}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK:-traefik_net}"
        - "traefik.http.routers.${INSTANCE_NAME:?INSTANCE_NAME not set}-board.rule=Host(`${NC_DOMAIN}`) && PathPrefix(`/whiteboard`)"
        - "traefik.http.routers.${INSTANCE_NAME}-board.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.${INSTANCE_NAME}-board.tls=true"
        - "traefik.http.routers.${INSTANCE_NAME}-board.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}"
        - "traefik.http.routers.${INSTANCE_NAME}-board.priority=100"
        - "traefik.http.middlewares.${INSTANCE_NAME}-board-strip.stripprefix.prefixes=/whiteboard"
        - "traefik.http.routers.${INSTANCE_NAME}-board.middlewares=${INSTANCE_NAME}-security@swarm,${INSTANCE_NAME}-board-strip@swarm"
        - "traefik.http.services.${INSTANCE_NAME}-board.loadbalancer.server.port=3002"

  # Talk: signaling (HPB) + janus + nats + eturnal TURN, in one image.
  #
  # THIS SERVICE PUBLISHES NO PORT, AND THAT IS THE POINT. It runs only as the
  # signaling server (HPB), reached through Traefik on the hostname below. The
  # STUN/TURN relay is SHARED — Chattanooga.Digital and Eduity both use the one
  # on 3478, which is what it was stood up for. Do not add a `ports:` block here
  # to give this stack a relay of its own: a second relay is redundant, and on
  # this cluster it cannot bind 3478 anyway because an ingress publish reserves
  # the port across every node and stack.
  #
  # Signaling is the half that CANNOT be shared today. The image bundles
  # signaling + janus + eturnal, and the signaling server is bound to a single
  # Nextcloud backend via NC_DOMAIN, so each site needs its own until that is
  # split out. TURN shares trivially; signaling does not.
  #
  # TALK_PORT sets BOTH what eturnal binds inside the container AND what the
  # server advertises to clients. It is not just an advertisement, so the
  # published port, the target port and TALK_PORT must all be the same number.
  # Get it wrong and the service still reports running while every STUN packet
  # lands on a port nothing listens on — calls connect and carry no media.
  #
  # RELAY_IP_V4 is required under ingress publishing. Ingress SNATs through the
  # overlay, so the relay sees 10.0.0.x instead of the real client address — a
  # STUN binding request against a working ingress-published TURN returns a
  # reflexive address of 10.0.0.2, which is useless as a relay candidate. The
  # strangewill fork exists precisely to allow overriding it; upstream
  # nextcloud/aio-talk derives it from `hostname -i` and cannot be corrected.
  #
  # Secrets are environment values here, and only here. The image reads
  # TURN_SECRET / SIGNALING_SECRET / INTERNAL_SECRET from the environment only —
  # verified in its /start.sh, whose sole *_FILE variable is SSL_CERT_FILE — so
  # there is no _FILE form to point at /run/secrets. The usual workaround is an
  # entrypoint wrapper, but Swarm ignores entrypoint overrides in stack deploys.
  # Every other credential in this stack should move to Swarm secrets; this one
  # cannot until the image supports it.
  talk:
    image: ${TALK_IMAGE:-strangewill/aio-talk-standalone}:${TALK_VERSION:-20260428}
    environment:
      NC_DOMAIN: ${NC_DOMAIN:?NC_DOMAIN not set}
      TALK_HOST: ${TALK_HOST:?TALK_HOST not set}
      TALK_PORT: ${TALK_PUBLISHED_PORT:-3478}
      RELAY_IP_V4: ${TALK_RELAY_IP:?TALK_RELAY_IP not set}
      EXTRA_WHITELIST_PEER: ${TALK_WHITELIST_PEER:-10.0.0.0/8}
      TURN_SECRET: ${TALK_TURN_SECRET:?TALK_TURN_SECRET not set}
      SIGNALING_SECRET: ${TALK_SIGNALING_SECRET:?TALK_SIGNALING_SECRET not set}
      INTERNAL_SECRET: ${TALK_INTERNAL_SECRET:?TALK_INTERNAL_SECRET not set}
      AIO_LOG_LEVEL: ${TALK_LOG_LEVEL:-info}
      TZ: ${TZ:-America/New_York}
    networks:
      - traefik_net
      - nextcloud_internal
    deploy:
      <<: *deploy-stateless
      resources:
        limits:
          memory: ${MEM_LIMIT_TALK:-1G}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK:-traefik_net}"
        - "traefik.http.routers.${INSTANCE_NAME:?INSTANCE_NAME not set}-talk.rule=Host(`${TALK_HOST}`)"
        - "traefik.http.routers.${INSTANCE_NAME}-talk.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.${INSTANCE_NAME}-talk.tls=true"
        - "traefik.http.routers.${INSTANCE_NAME}-talk.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}"
        - "traefik.http.services.${INSTANCE_NAME}-talk.loadbalancer.server.port=8081"
