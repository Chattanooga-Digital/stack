# The vendor's substitute for a per-user forced password change:
# https://docs.goauthentik.io/users-sources/user/password_reset_on_login/
version: 1
metadata:
  name: chattanooga-force-password-reset
  labels:
    blueprints.goauthentik.io/description: >-
      Prompts for a new password at login when the user carries
      reset_password: true, then clears the flag.

entries:
  - id: policy-check
    model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: chattanooga-reset-password-check
    attrs:
      execution_logging: false
      expression: |
        if request.context["pending_user"].attributes.get("reset_password") == True:
            return True
        return False

  - id: policy-update
    model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: chattanooga-reset-password-update
    attrs:
      execution_logging: false
      expression: |
        if request.context["pending_user"].attributes.get("reset_password") == True:
            request.context["pending_user"].attributes["reset_password"] = False
            return True
        return False

  - id: stage-prompt
    model: authentik_stages_prompt.promptstage
    identifiers:
      name: chattanooga-force-password-reset-prompt
    attrs:
      fields:
        - !Find [authentik_stages_prompt.prompt, [name, default-password-change-field-password]]
        - !Find [authentik_stages_prompt.prompt, [name, default-password-change-field-password-repeat]]
      validation_policies:
        # The vendor page drops "password" from this name; that object does not exist.
        - !Find [authentik_policies_password.passwordpolicy, [name, default-password-change-password-policy]]

  - id: stage-write
    model: authentik_stages_user_write.userwritestage
    identifiers:
      name: chattanooga-force-password-reset-write
    attrs:
      user_creation_mode: never_create

  # Orders 25 and 26 sit between the password (20) and mfa-validation (30) stages.
  # pending_user does not exist when the flow is planned, so evaluate_on_plan stays
  # false or the stage is skipped without an error.
  - id: binding-prompt
    model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      order: 25
    attrs:
      stage: !KeyOf stage-prompt
      evaluate_on_plan: false
      re_evaluate_policies: true

  - id: binding-write
    model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      order: 26
    attrs:
      stage: !KeyOf stage-write
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-prompt
      order: 0
    attrs:
      policy: !KeyOf policy-check

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-write
      order: 0
    attrs:
      policy: !KeyOf policy-update

  # A recovery flow lets POST /api/v3/core/users/<pk>/recovery/ return a link.
  # Without one it answers 400.
  - id: flow-set-password
    model: authentik_flows.flow
    identifiers:
      slug: chattanooga-set-password
    attrs:
      name: Set your password
      title: Choose a password for your account
      designation: recovery
      # The link's token identifies the person, so the flow cannot require a session.
      authentication: none

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-set-password
      order: 10
    attrs:
      stage: !Find [authentik_stages_prompt.promptstage, [name, default-password-change-prompt]]
      evaluate_on_plan: true
      re_evaluate_policies: false

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-set-password
      order: 20
    attrs:
      stage: !Find [authentik_stages_user_write.userwritestage, [name, default-password-change-write]]
      evaluate_on_plan: true
      re_evaluate_policies: false

  # Without this the recovery endpoint still reports no flow.
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      flow_recovery: !KeyOf flow-set-password

  - id: policy-self-started
    model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: chattanooga-recovery-only-if-self-started
    attrs:
      execution_logging: false
      expression: |
        # Skip identification and email when the flow was entered through a minted link.
        return not request.context.get("is_restored", False)

  - id: stage-recovery-ident
    model: authentik_stages_identification.identificationstage
    identifiers:
      name: chattanooga-recovery-identification
    attrs:
      user_fields: [email, username]
      case_insensitive_matching: true
      show_matched_user: false

  - id: stage-recovery-email
    model: authentik_stages_email.emailstage
    identifiers:
      name: chattanooga-recovery-email
    attrs:
      use_global_settings: true
      activate_user_on_success: true
      subject: Set your Chattanooga.Digital password
      template: email/password_reset.html

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-set-password
      order: 5
    attrs:
      stage: !KeyOf stage-recovery-ident
      evaluate_on_plan: false
      re_evaluate_policies: true
    id: binding-recovery-ident

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-set-password
      order: 6
    attrs:
      stage: !KeyOf stage-recovery-email
      evaluate_on_plan: false
      re_evaluate_policies: true
    id: binding-recovery-email

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-recovery-ident
      order: 0
    attrs:
      policy: !KeyOf policy-self-started

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-recovery-email
      order: 0
    attrs:
      policy: !KeyOf policy-self-started

  # Patches a stock object. An entry is validated whole, so the other fields restate
  # the stage's existing values, and one failed entry fails the whole blueprint.
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields: [email, username]
      case_insensitive_matching: true
      show_matched_user: true
      pretend_user_exists: true
      enable_remember_me: false
      show_source_labels: false
      recovery_flow: !KeyOf flow-set-password

  # Do not set reset_password from this file. It re-applies on every discovery and
  # would restore the flag after it was cleared.

  # A completed recovery leaves reset_password set, so the next login prompts again.
  # The write stage stores prompt_data keys starting with attributes. on the user.
  - id: policy-recovery-clear
    model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: chattanooga-recovery-clear-reset-flag
    attrs:
      execution_logging: false
      expression: |
        request.context.setdefault("prompt_data", {})["attributes.reset_password"] = False
        return True

  # prompt_data does not exist at plan time, so evaluate when the stage is reached.
  - id: binding-recovery-write
    model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, chattanooga-set-password]]
      stage: !Find [authentik_stages_user_write.userwritestage, [name, default-password-change-write]]
      order: 20
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - id: policybinding-recovery-clear
    model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-recovery-clear
      target: !KeyOf binding-recovery-write
      order: 0
    attrs:
      enabled: true
      timeout: 30
