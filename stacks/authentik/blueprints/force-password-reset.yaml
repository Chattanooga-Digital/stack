# Force a password change at first login.
#
# authentik has no per-user "must change this password" flag. This is the vendor's
# documented substitute:
#   https://docs.goauthentik.io/users-sources/user/password_reset_on_login/
# Two expression policies, a prompt stage, a user-write stage, and the bindings that
# put them in the authentication flow between the password check and MFA.
#
# Flag a person with the user attribute  reset_password: true  (via the API, NOT here
# -- see the warning at the bottom of this file).
version: 1
metadata:
  name: chattanooga-force-password-reset
  labels:
    blueprints.goauthentik.io/description: >-
      Prompts for a new password at login when the user carries
      reset_password: true, then clears the flag.

entries:
  # ---------------------------------------------------------------- policies
  - id: policy-check
    model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: chattanooga-reset-password-check
    attrs:
      execution_logging: false
      expression: |
        # Gate the prompt: does this user still owe us a password change?
        if request.context["pending_user"].attributes.get("reset_password") == True:
            return True
        return False

  - id: policy-update
    model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: chattanooga-reset-password-update
    attrs:
      execution_logging: false
      expression: |
        # Same test, but clear the flag so the next login is not prompted again.
        if request.context["pending_user"].attributes.get("reset_password") == True:
            request.context["pending_user"].attributes["reset_password"] = False
            return True
        return False

  # ------------------------------------------------------------------ stages
  - id: stage-prompt
    model: authentik_stages_prompt.promptstage
    identifiers:
      name: chattanooga-force-password-reset-prompt
    attrs:
      fields:
        - !Find [authentik_stages_prompt.prompt, [name, default-password-change-field-password]]
        - !Find [authentik_stages_prompt.prompt, [name, default-password-change-field-password-repeat]]
      validation_policies:
        # NOTE the name: the vendor page abbreviates this to
        # "default-password-change-policy", which does not exist. The real object is
        # default-password-change-password-policy.
        - !Find [authentik_policies_password.passwordpolicy, [name, default-password-change-password-policy]]

  - id: stage-write
    model: authentik_stages_user_write.userwritestage
    identifiers:
      name: chattanooga-force-password-reset-write
    attrs:
      user_creation_mode: never_create

  # ---------------------------------------------------------------- bindings
  # Orders 25 and 26 sit between default-authentication-password (20) and
  # default-authentication-mfa-validation (30). Those are the live orders on this
  # instance, read before choosing these numbers rather than assumed.
  #
  # evaluate_on_plan MUST be false and re_evaluate_policies MUST be true: the policies
  # above read request.context["pending_user"], which does not exist yet when the flow
  # is planned -- only after the identification stage has run. Evaluating on plan
  # raises KeyError and the stage is silently skipped.
  - id: binding-prompt
    model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      order: 25
    attrs:
      stage: !KeyOf stage-prompt
      evaluate_on_plan: false
      re_evaluate_policies: true

  - id: binding-write
    model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      order: 26
    attrs:
      stage: !KeyOf stage-write
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-prompt
      order: 0
    attrs:
      policy: !KeyOf policy-check

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-write
      order: 0
    attrs:
      policy: !KeyOf policy-update

  # ------------------------------------------------------- set-password flow
  # A recovery-designation flow is what lets the API MINT a set-password link:
  #   POST /api/v3/core/users/<pk>/recovery/   ->  {"link": "..."}
  # Without one, that endpoint returns 400 "No recovery flow set.". Note this is
  # the endpoint that RETURNS the link; /recovery_email/ is the one that mails it,
  # and needs working SMTP. We only need the link, because the invitation is sent
  # by a human, not by authentik.
  - id: flow-set-password
    model: authentik_flows.flow
    identifiers:
      slug: chattanooga-set-password
    attrs:
      name: Set your password
      title: Choose a password for your account
      designation: recovery
      # The single-use token in the link is what identifies the person, so the
      # flow itself must not demand an existing session.
      authentication: none

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-set-password
      order: 10
    attrs:
      stage: !Find [authentik_stages_prompt.promptstage, [name, default-password-change-prompt]]
      evaluate_on_plan: true
      re_evaluate_policies: false

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-set-password
      order: 20
    attrs:
      stage: !Find [authentik_stages_user_write.userwritestage, [name, default-password-change-write]]
      evaluate_on_plan: true
      re_evaluate_policies: false

  # Point the brand at it, or the recovery endpoint still reports none is set.
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      flow_recovery: !KeyOf flow-set-password

  # ------------------------------------------------- self-service recovery
  # With these, a person can start the reset themselves from the login page and
  # authentik mails them the link. That removes the need to carry a minted link
  # by hand, and with it the problem of one expiring before the invite is read.
  - id: policy-self-started
    model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: chattanooga-recovery-only-if-self-started
    attrs:
      execution_logging: false
      expression: |
        # Ask who you are, and email you, ONLY when you arrived under your own
        # steam. A flow entered through a minted link is already identified, and
        # re-running these stages would ask a known person to identify again.
        return not request.context.get("is_restored", False)

  - id: stage-recovery-ident
    model: authentik_stages_identification.identificationstage
    identifiers:
      name: chattanooga-recovery-identification
    attrs:
      user_fields: [email, username]
      case_insensitive_matching: true
      show_matched_user: false

  - id: stage-recovery-email
    model: authentik_stages_email.emailstage
    identifiers:
      name: chattanooga-recovery-email
    attrs:
      # Uses AUTHENTIK_EMAIL__* from the stack environment rather than repeating
      # the relay credential here, where it would sit in the repo.
      use_global_settings: true
      activate_user_on_success: true
      subject: Set your Chattanooga.Digital password
      template: email/password_reset.html

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-set-password
      order: 5
    attrs:
      stage: !KeyOf stage-recovery-ident
      evaluate_on_plan: false
      re_evaluate_policies: true
    id: binding-recovery-ident

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-set-password
      order: 6
    attrs:
      stage: !KeyOf stage-recovery-email
      evaluate_on_plan: false
      re_evaluate_policies: true
    id: binding-recovery-email

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-recovery-ident
      order: 0
    attrs:
      policy: !KeyOf policy-self-started

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-recovery-email
      order: 0
    attrs:
      policy: !KeyOf policy-self-started

  # Put a "forgot your password" route on the login page itself.
  # This PATCHES a stock object, and a blueprint entry is validated as a whole
  # object rather than a patch: supplying only recovery_flow fails validation,
  # and one failed entry fails the ENTIRE blueprint, so nothing else applies
  # either. The other fields below are the stage's existing values, restated so
  # the entry validates.
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields: [email, username]
      case_insensitive_matching: true
      show_matched_user: true
      pretend_user_exists: true
      enable_remember_me: false
      show_source_labels: false
      recovery_flow: !KeyOf flow-set-password

# WARNING -- do not add authentik_core.user entries here to set reset_password.
# A blueprint re-applies on every discovery, so a baked-in reset_password: true would
# set the flag back after someone had just cleared it, and that person could never
# finish logging in. The flag is per-person state and belongs on the API.

  # ------------------------------------------------- the recovery-flow half
  # Measured 2026-09-23: without this, a completed self-service reset leaves
  # reset_password: true, so the NEXT login prompts for another change. That is
  # exactly what Rob Aitchison hit on 2026-09-21 -- "had to login twice after
  # reset, may have been a one-time issue". It was not a one-time issue, it was
  # this. Keycloak and Zitadel clear their equivalent flag on a self-service
  # reset; ours did not, so Authentik was being scored for our omission.
  #
  # prompt_data keys beginning "attributes." are written onto the user by the
  # user-write stage -- see UserWriteStageView.write_attribute in
  # authentik/stages/user_write/stage.py.
  - id: policy-recovery-clear
    model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: chattanooga-recovery-clear-reset-flag
    attrs:
      execution_logging: false
      expression: |
        # The recovery flow sets a password but does not touch our attribute.
        request.context.setdefault("prompt_data", {})["attributes.reset_password"] = False
        return True

  # The write stage of the recovery flow must evaluate its policies when the
  # stage is REACHED, not when the flow is planned: prompt_data does not exist
  # at plan time. Same trap as the bindings above, and it fails silently.
  - id: binding-recovery-write
    model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, chattanooga-set-password]]
      stage: !Find [authentik_stages_user_write.userwritestage, [name, default-password-change-write]]
      order: 20
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - id: policybinding-recovery-clear
    model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-recovery-clear
      target: !KeyOf binding-recovery-write
      order: 0
    attrs:
      enabled: true
      timeout: 30
