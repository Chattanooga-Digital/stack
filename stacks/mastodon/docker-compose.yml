x-mastodon-env: &mastodon-env
  LOCAL_DOMAIN: ${MASTODON_DOMAIN:?MASTODON_DOMAIN not set}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  DB_HOST: ${DB_HOST:-postgres_db}
  DB_PORT: ${DB_PORT:-5432}
  DB_USER: ${DB_USER:-mastodon}
  DB_NAME: ${DB_NAME:-mastodon}
  DB_PASS: ${DB_PASSWORD:?DB_PASSWORD not set}
  ES_ENABLED: ${ES_ENABLED:-true}
  ES_HOST: es
  ES_PORT: 9200
  ES_PRESET: ${ES_PRESET:-single_node_cluster}
  # Ignored while es runs with xpack.security.enabled=false.
  ES_USER: ${ES_USER:-elastic}
  ES_PASS: ${ES_PASS:-}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE not set}
  OTP_SECRET: ${OTP_SECRET:?OTP_SECRET not set}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:?ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY not set}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:?ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT not set}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:?ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY not set}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY not set}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY not set}
  SMTP_SERVER: ${SMTP_SERVER:?SMTP_SERVER not set}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_LOGIN: ${SMTP_LOGIN:?SMTP_LOGIN not set}
  SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD not set}
  SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:?SMTP_FROM_ADDRESS not set}
  S3_ENABLED: ${S3_ENABLED:-true}
  S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT not set}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET not set}
  S3_ALIAS_HOST: ${S3_ALIAS_HOST:?S3_ALIAS_HOST not set}
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID not set}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY not set}
  IP_RETENTION_PERIOD: ${IP_RETENTION_PERIOD:-31556952}
  SESSION_RETENTION_PERIOD: ${SESSION_RETENTION_PERIOD:-31556952}

x-networks-internal: &networks-internal
  - internal_network

x-networks-egress: &networks-egress
  - internal_network
  - traefik_net

x-volumes-mastodon: &volumes-mastodon
  - public_system:/mastodon/public/system

x-update-stateful: &update-stateful
  order: stop-first
  parallelism: 1
  delay: 5s
  failure_action: rollback
  monitor: 60s

x-update-rolling: &update-rolling
  order: start-first
  parallelism: 1
  delay: 5s
  failure_action: rollback
  monitor: 60s

x-deploy-defaults: &deploy-defaults
  replicas: 1
  update_config: *update-stateful
  restart_policy:
    condition: on-failure
  placement:
    constraints:
      - ${PLACEMENT_CONSTRAINT:-node.role == manager}

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

services:

  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    networks: *networks-internal
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
    volumes:
      - redis:/data
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${MEM_LIMIT_REDIS:-512M}
        reservations:
          memory: 128M

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-8.19.19}
    environment:
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}"
      - "xpack.license.self_generated.type=basic"
      - "xpack.security.enabled=false"
      - "xpack.watcher.enabled=false"
      - "xpack.graph.enabled=false"
      - "xpack.ml.enabled=false"
      - "cluster.name=es-mastodon"
      - "discovery.type=single-node"
      - "thread_pool.write.queue_size=1000"
    networks: *networks-internal
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "curl --silent --fail localhost:9200/_cluster/health || exit 1"]
      retries: 5
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${MEM_LIMIT_ES:-2G}
        reservations:
          memory: 1G

  web:
    image: ghcr.io/mastodon/mastodon:${MASTODON_VERSION:?MASTODON_VERSION not set}
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    environment: *mastodon-env
    networks: *networks-egress
    healthcheck:
      <<: *healthcheck-defaults
      # prettier-ignore
      test: ['CMD-SHELL',"curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1"]
    depends_on:
      - redis
      - es
    volumes: *volumes-mastodon
    deploy:
      <<: *deploy-defaults
      update_config: *update-rolling
      resources:
        limits:
          memory: ${MEM_LIMIT_WEB:-2G}
        reservations:
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK:-traefik_net}"
        - "traefik.http.routers.${INSTANCE_NAME:?INSTANCE_NAME not set}-web.rule=Host(`${MASTODON_DOMAIN}`)"
        - "traefik.http.routers.${INSTANCE_NAME}-web.priority=1"
        - "traefik.http.routers.${INSTANCE_NAME}-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.${INSTANCE_NAME}-web.tls=true"
        - "traefik.http.routers.${INSTANCE_NAME}-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}"
        - "traefik.http.services.${INSTANCE_NAME}-web.loadbalancer.server.port=3000"
        - "traefik.http.middlewares.${INSTANCE_NAME}-upload.buffering.maxRequestBodyBytes=${UPLOAD_MAX_BYTES:-10485760}"
        - "traefik.http.routers.${INSTANCE_NAME}-web.middlewares=${INSTANCE_NAME}-upload@swarm"

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:${MASTODON_VERSION:?MASTODON_VERSION not set}
    command: ["node", "./streaming/index.js"]
    environment: *mastodon-env
    networks: *networks-egress
    healthcheck:
      <<: *healthcheck-defaults
      # prettier-ignore
      test: ['CMD-SHELL', "curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q 'OK' || exit 1"]
      start_period: 30s
    depends_on:
      - redis
    deploy:
      <<: *deploy-defaults
      update_config: *update-rolling
      resources:
        limits:
          memory: ${MEM_LIMIT_STREAMING:-512M}
        reservations:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK:-traefik_net}"
        - "traefik.http.routers.${INSTANCE_NAME:?INSTANCE_NAME not set}-streaming.rule=Host(`${MASTODON_DOMAIN}`) && PathPrefix(`/api/v1/streaming`)"
        - "traefik.http.routers.${INSTANCE_NAME}-streaming.priority=10"
        - "traefik.http.routers.${INSTANCE_NAME}-streaming.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.${INSTANCE_NAME}-streaming.tls=true"
        - "traefik.http.routers.${INSTANCE_NAME}-streaming.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}"
        - "traefik.http.services.${INSTANCE_NAME}-streaming.loadbalancer.server.port=4000"

  sidekiq:
    image: ghcr.io/mastodon/mastodon:${MASTODON_VERSION:?MASTODON_VERSION not set}
    command: ["bundle", "exec", "sidekiq"]
    environment: *mastodon-env
    depends_on:
      - redis
    networks: *networks-egress
    volumes: *volumes-mastodon
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "ps aux | grep -q '[s]idekiq' || exit 1"]
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${MEM_LIMIT_SIDEKIQ:-2G}
        reservations:
          memory: 512M

volumes:
  public_system: {}
  elasticsearch: {}
  redis: {}

networks:
  traefik_net:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_net}
  internal_network:
    external: true
    name: ${INTERNAL_NETWORK:-internal_network}
