x-deploy-defaults: &deploy-defaults
  replicas: 1
  update_config:
    order: stop-first
    parallelism: 1
    delay: 5s
    failure_action: rollback
    monitor: 60s
  restart_policy:
    condition: any
    delay: 10s
    max_attempts: 0
  placement:
    constraints:
      - ${PLACEMENT_CONSTRAINT:-node.role == manager}

networks:
  traefik_net:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_net}
  listmonk_internal:
    driver: overlay
    attachable: false

volumes:
  listmonk_db:
    driver: local
  listmonk_uploads:
    driver: local

configs:
  configure_v1:
    # Bump when configure.mjs changes; Swarm configs are immutable.
    file: ./scripts/configure.mjs

services:
  db:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
      POSTGRES_DB: listmonk
    volumes:
      - listmonk_db:/var/lib/postgresql/data
    networks:
      - listmonk_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk -d listmonk"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${MEM_LIMIT_DB:-512M}

  # Install and upgrade run on every start, so changing LISTMONK_VERSION is the whole upgrade.
  app:
    image: listmonk/listmonk:${LISTMONK_VERSION:?LISTMONK_VERSION not set}
    command:
      - sh
      - -c
      - ./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && exec ./listmonk --config ''
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: db
      LISTMONK_db__port: 5432
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${DB_PASSWORD:?DB_PASSWORD not set}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      # Read once at install; changing them later does nothing.
      LISTMONK_ADMIN_USER: ${ADMIN_USER:?ADMIN_USER not set}
      LISTMONK_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD not set}
    volumes:
      - listmonk_uploads:/listmonk/uploads
    networks:
      - traefik_net
      - listmonk_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${MEM_LIMIT_APP:-256M}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK:-traefik_net}"
        - "traefik.http.routers.${INSTANCE_NAME:?INSTANCE_NAME not set}.rule=Host(`${LISTMONK_DOMAIN:?LISTMONK_DOMAIN not set}`)"
        - "traefik.http.routers.${INSTANCE_NAME}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.${INSTANCE_NAME}.tls=true"
        - "traefik.http.routers.${INSTANCE_NAME}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}"
        - "traefik.http.services.${INSTANCE_NAME}.loadbalancer.server.port=9000"

  # listmonk keeps these settings in its database, so this writes them through its API.
  configure:
    image: node:${NODE_VERSION:-22-alpine}
    command: ["node", "/configure.mjs"]
    environment:
      LISTMONK_URL: http://app:9000
      LISTMONK_ROOT_URL: https://${LISTMONK_DOMAIN:?LISTMONK_DOMAIN not set}
      ADMIN_USER: ${ADMIN_USER:?ADMIN_USER not set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD not set}
      SITE_NAME: ${SITE_NAME:-Newsletter}
      FROM_NAME: ${FROM_NAME:?FROM_NAME not set}
      FROM_EMAIL: ${FROM_EMAIL:?FROM_EMAIL not set}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST not set}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME not set}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD not set}
      SMTP_TLS: ${SMTP_TLS:-STARTTLS}
      SEND_RATE: ${SEND_RATE:-10}
      SENDGRID_WEBHOOK_KEY: ${SENDGRID_WEBHOOK_KEY:-}
    configs:
      - source: configure_v1
        target: /configure.mjs
    networks:
      - listmonk_internal
    depends_on:
      - app
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 20
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == manager}
      resources:
        limits:
          memory: ${MEM_LIMIT_CONFIGURE:-128M}
