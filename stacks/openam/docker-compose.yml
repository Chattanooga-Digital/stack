services:
  # This image advertises BASE_DN as a naming context without creating the base
  # entry, and carries none of OpenAM's user schema. dj-prep adds both.
  opendj:
    image: openidentityplatform/opendj:${OPENDJ_VERSION:-5.1.2}
    environment:
      BASE_DN: ${CONFIG_BASE_DN:-dc=openam,dc=example,dc=org}
      ROOT_USER_DN: ${DIRECTORY_USER_DN:-cn=Directory Manager}
      ROOT_PASSWORD: ${DIRECTORY_PASSWORD:?DIRECTORY_PASSWORD not set}
    volumes:
      - openam-config:/opt/opendj/data
    networks:
      - openam_internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: stop-first
      restart_policy:
        condition: any
      resources:
        limits:
          memory: ${MEM_LIMIT_OPENDJ:-512M}

  openam:
    image: openidentityplatform/openam:${OPENAM_VERSION:?OPENAM_VERSION not set}
    environment:
      # Replaces the image's CATALINA_OPTS, so the two config-path flags stay. Without
      # them OpenAM keeps its bootstrap pointer inside the container, and a recreate
      # serves the first-time setup wizard.
      CATALINA_OPTS: -server -Xms${JVM_HEAP_MIN:-512m} -Xmx${JVM_HEAP_MAX:-1g} -Dcom.iplanet.services.configpath=/usr/openam/config -Dcom.sun.identity.configuration.directory=/usr/openam/config
      TZ: ${TZ:-America/New_York}
    volumes:
      - openam-home:/usr/openam
    networks:
      - traefik_net
      - openam_internal
    depends_on:
      - opendj
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK:-traefik_net}"
        - "traefik.http.routers.${INSTANCE_NAME:?INSTANCE_NAME not set}.rule=Host(`${DOMAIN:?DOMAIN not set}`)"
        - "traefik.http.routers.${INSTANCE_NAME}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.${INSTANCE_NAME}.tls=true"
        - "traefik.http.routers.${INSTANCE_NAME}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}"
        - "traefik.http.services.${INSTANCE_NAME}.loadbalancer.server.port=8080"
      restart_policy:
        condition: any
      resources:
        limits:
          memory: ${MEM_LIMIT_OPENAM:-1500M}

  dj-prep:
    image: openidentityplatform/opendj:${OPENDJ_VERSION:-5.1.2}
    # Root, to write its completion marker onto a fresh, root-owned volume.
    user: "0"
    entrypoint: ["/bin/sh", "/opendj-prep.sh"]
    # Both images declare a healthcheck for a server a one-shot never starts, and Swarm
    # kills the task as unhealthy (exit 137).
    healthcheck:
      disable: true
    configs:
      - source: opendj_prep_sh
        target: /opendj-prep.sh
        mode: 0555
      - {source: openam_schema_version, target: /schema/VERSION, mode: 0444}
      - {source: openam_schema_user, target: /schema/opendj_user_schema.ldif, mode: 0444}
      - {source: openam_schema_dashboard, target: /schema/opendj_dashboard.ldif, mode: 0444}
      - {source: openam_schema_deviceprint, target: /schema/opendj_deviceprint.ldif, mode: 0444}
      - {source: openam_schema_kba, target: /schema/opendj_kba.ldif, mode: 0444}
      - {source: openam_schema_oathdevices, target: /schema/opendj_oathdevices.ldif, mode: 0444}
      - {source: openam_schema_pushdevices, target: /schema/opendj_pushdevices.ldif, mode: 0444}
      - {source: openam_schema_userinit, target: /schema/opendj_userinit.ldif, mode: 0444}
    environment:
      DIRECTORY_PASSWORD: ${DIRECTORY_PASSWORD:?DIRECTORY_PASSWORD not set}
      BASE_DN: ${CONFIG_BASE_DN:-dc=openam,dc=example,dc=org}
      OPENAM_VERSION: ${OPENAM_VERSION:?OPENAM_VERSION not set}
    volumes:
      - openam-ldif:/ldif
    networks:
      - openam_internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: none

  post-install:
    image: openidentityplatform/openam:${OPENAM_VERSION:?OPENAM_VERSION not set}
    entrypoint: ["/bin/sh", "/post-install.sh"]
    healthcheck:
      disable: true    # the image's check probes a Tomcat this one-shot never starts
    configs:
      - source: openam_post_install_sh
        target: /post-install.sh
        mode: 0555
    environment:
      OPENAM_URL: https://${DOMAIN:?DOMAIN not set}/openam
      OPENAM_VERSION: ${OPENAM_VERSION:?OPENAM_VERSION not set}
      OPENAM_ADMIN_PASSWORD: ${OPENAM_ADMIN_PASSWORD:?OPENAM_ADMIN_PASSWORD not set}
      OPENAM_AMLDAPUSER_PASSWORD: ${OPENAM_AMLDAPUSER_PASSWORD:?OPENAM_AMLDAPUSER_PASSWORD not set}
      DIRECTORY_PASSWORD: ${DIRECTORY_PASSWORD:?DIRECTORY_PASSWORD not set}
      BASE_DN: ${CONFIG_BASE_DN:-dc=openam,dc=example,dc=org}
      DIRECTORY_SERVER: opendj
      DIRECTORY_PORT: "1389"
      OPENAM_USERS: ${OPENAM_USERS:-}
      OPENAM_ADMIN_GROUP: ${OPENAM_ADMIN_GROUP:-co-op-admins}
      OPENAM_ADMINS: ${OPENAM_ADMINS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@get.chattanooga.digital}
    volumes:
      - openam-home:/usr/openam
      - openam-ldif:/ldif:ro   # only to see dj-prep's .prep-done marker
    networks:
      - openam_internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: none

networks:
  traefik_net:
    external: true
  openam_internal: {}

configs:
  # Swarm configs are immutable. Bump the name when the script changes.
  opendj_prep_sh:
    name: ${OPENDJ_PREP_CONFIG_NAME:-openam_djprep_7}
    file: ./scripts/opendj-prep.sh
  openam_post_install_sh:
    name: ${POST_INSTALL_CONFIG_NAME:-openam_postinstall_11}
    file: ./scripts/post-install.sh
  # Named per OpenAM version; rename with the files on an upgrade.
  openam_schema_version:     {name: openam_schema_16_1_3_version,     file: ./schema/VERSION}
  openam_schema_user:        {name: openam_schema_16_1_3_user,        file: ./schema/opendj_user_schema.ldif}
  openam_schema_dashboard:   {name: openam_schema_16_1_3_dashboard,   file: ./schema/opendj_dashboard.ldif}
  openam_schema_deviceprint: {name: openam_schema_16_1_3_deviceprint, file: ./schema/opendj_deviceprint.ldif}
  openam_schema_kba:         {name: openam_schema_16_1_3_kba,         file: ./schema/opendj_kba.ldif}
  openam_schema_oathdevices: {name: openam_schema_16_1_3_oathdevices, file: ./schema/opendj_oathdevices.ldif}
  openam_schema_pushdevices: {name: openam_schema_16_1_3_pushdevices, file: ./schema/opendj_pushdevices.ldif}
  openam_schema_userinit:    {name: openam_schema_16_1_3_userinit,    file: ./schema/opendj_userinit.ldif}

volumes:
  openam-config:
  openam-home:
  openam-ldif:
